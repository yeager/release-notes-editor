[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-notes-editor"
version = "0.1.3"
description = "GTK4 release notes editor with templates and translation support"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Daniel Nylander", email = "daniel@danielnylander.se"}]
dependencies = ["PyGObject>=3.42"]

[project.scripts]
release-notes-editor = "release_notes_editor.main:main"

[tool.setuptools.packages.find]
where = ["src"]
